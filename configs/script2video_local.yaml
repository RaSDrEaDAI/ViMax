# Hybrid local-first config for script2video.
#
# IMAGE ROUTING (multi-model smart router, July 2026):
#   Multi-character frames (2+ visible chars)  -> Ideogram V4 JSON ($0.043/gen)
#                                                  with CompositionPlanner agent
#                                                  producing bbox layout
#   Multi-ref composition (2+ ref images)       -> Qwen Edit 2511 (free local)
#   Frames needing rendered text                -> Qwen 2512 (free local)
#   Single-char portraits (no LoRA)             -> Qwen 2512 (free local, best identity)
#   Pure environment / establishing plates      -> Z-image Turbo (free local, fast)
#   LoRA-configured character shots             -> Flux 1-dev + LoRA (free local)
#   Fallback                                     -> Flux 1-dev (free local)
#
# VIDEO ROUTING (3-gate escalation router):
#   ALL video defaults to local LTX 2.3 (free, fast)
#   Escalates to fal.ai Veo 3 only on: lipsync, multiref, large variation,
#   high complexity, manual override, or local failure.

chat_model:
  init_args:
    model: claude-opus-4-8
    model_provider: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    max_tokens: 16384         # headroom for Opus 4.8's verbose extractions (was 8192). Opus 4.8 caps at 128K.
    # NOTE: temperature is deprecated/rejected by claude-opus-4-8 (API 400). Do not set it.
  max_requests_per_minute: 40
  max_requests_per_day: 2000
  # No text_only flag — Claude supports vision natively.


# Vision LLM — RETIRED 2026-07-18. Claude Opus 4.1 handles vision natively.
# ReferenceImageSelector now uses the multimodal path directly with the main chat_model.
#
# vision_chat_model:
#   class_path: tools.vision_model.VisionModelClient
#   init_args:
#     api_key: ${FAL_API_KEY}
#     model: google/gemini-2.5-flash
#     endpoint: https://fal.run/fal-ai/any-llm
#     timeout: 60
#   max_requests_per_minute: 20


image_generator:
  class_path: tools.ImageGeneratorRouter
  init_args:
    default_backend: qwen
    # ── Routing flags (2026-07-18) ──────────────────────────────────────
    # Qwen 2512 FIXED: was using wrong text encoder. Now qwen_2.5_vl_7b_fp8_scaled.
    # Z-image Turbo FIXED: workflow was structurally wrong. Now pixel-space recipe
    #   per ComfyUI's official blueprint: qwen_3_4b + ae.safetensors VAE + AuraFlow shift=3.
    route_portraits_to_qwen: true
    route_text_to_qwen: true
    route_environments_to_zimage: true
    route_multiref_to_qwen_edit: true
    multiref_threshold: 1  # single-ref shots also use Qwen Edit (don\'t drop refs)

    # Flux 1-dev + LoRA support. Used for LoRA-locked characters and fallback.
    flux_backend:
      class_path: tools.ImageGeneratorComfyUI
      init_args:
        base_url: http://127.0.0.1:8189
        t2i_workflow: workflows/flux1_dev_t2i_lora.json
        i2i_workflow: workflows/flux1_kontext_i2i.json
      max_requests_per_minute: 12

    # Qwen 2512 — best portraits, character identity, text-in-image.
    qwen_backend:
      class_path: tools.ImageGeneratorComfyUI
      init_args:
        base_url: http://127.0.0.1:8189
        t2i_workflow: workflows/qwen2512_t2i.json
      max_requests_per_minute: 8

    # Z-image Turbo — fast environment / establishing plates.
    zimage_backend:
      class_path: tools.ImageGeneratorComfyUI
      init_args:
        base_url: http://127.0.0.1:8189
        t2i_workflow: workflows/zimage_turbo_t2i.json
      max_requests_per_minute: 15

    # Qwen Image Edit 2511 — multi-ref composition (char + env, 1-3 refs).
    qwen_edit_backend:
      class_path: tools.ImageGeneratorComfyUI
      init_args:
        base_url: http://127.0.0.1:8189
        i2i_workflow: workflows/qwen_edit_2511_multiref.json
      max_requests_per_minute: 6

    # Ideogram V4 JSON — multi-character bbox layout. LOCAL inference (free).
    # Uses Ideogram4PromptBuilderKJ + DualModelGuider + Ideogram4Scheduler.
    ideogram_backend:
      class_path: tools.ImageGeneratorComfyUI
      init_args:
        base_url: http://127.0.0.1:8189  # direct (local model, free)
        t2i_workflow: workflows/ideogram_v4_json.json
      max_requests_per_minute: 8

    # CompositionPlanner — LLM agent that converts frame metadata to
    # Ideogram V4 json_prompt with per-character bbox layout.
    # Uses vision_model to look at reference boards when provided.
    composition_planner:
      class_path: agents.composition_planner.CompositionPlanner
      init_args:
        chat_model: "${chat_model}"
        vision_model: "${vision_model}"

    # Routing policy flags
    route_multichar_to_ideogram: true
    route_text_to_qwen: true
    route_environments_to_zimage: true
    route_multiref_to_qwen_edit: true
    multiref_threshold: 1  # single-ref shots also use Qwen Edit (don\'t drop refs)
    route_portraits_to_qwen: true


video_generator:
  class_path: tools.VideoGeneratorRouter
  init_args:
    default_route: local
    local_backend:
      class_path: tools.VideoGeneratorComfyUI
      init_args:
        base_url: http://127.0.0.1:8189
        i2v_workflow: workflows/ltx23_i2v.json
        flf2v_workflow: workflows/ltx23_flf2v.json
        t2v_workflow: workflows/ltx23_t2v.json
      max_requests_per_minute: 10
    escalation_backend:
      class_path: tools.VideoGeneratorFalAI
      init_args:
        api_key: ${FAL_API_KEY}
        t2v_model: fal-ai/veo3/fast
        ff2v_model: fal-ai/veo3/fast/image-to-video
      max_requests_per_minute: 5
      max_requests_per_day: 50
    escalate_on_lipsync: true
    escalate_on_multiref: true
    escalate_on_large_variation: true
    escalate_on_high_complexity: true
    retry_escalation_on_local_failure: true


working_dir: .working_dir/script2video
