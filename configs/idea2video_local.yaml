# Hybrid local-first config for idea2video. Mirrors script2video_local.yaml.
#
# Same multi-model image router + 3-gate video escalation router.

chat_model:
  init_args:
    model: claude-opus-4-1-20250805
    model_provider: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    max_tokens: 8192          # Anthropic requires explicit max_tokens; 8K is ample for all ViMax agents
    temperature: 0.7          # slightly creative for story/screenplay; agents that need determinism override locally
  max_requests_per_minute: 40   # Anthropic Opus tier limits; ViMax rarely exceeds 20 concurrent
  max_requests_per_day: 2000
  # No text_only flag — Claude supports vision natively, so ReferenceImageSelector
  # uses the multimodal path directly (no separate vision_chat_model needed).


# Vision LLM — RETIRED 2026-07-18. Claude Opus 4.1 handles vision natively.
# The Gemini-via-fal VisionModelClient is no longer needed for CompositionPlanner.
# Section kept commented for reference; uncomment to restore the separate vision path.
